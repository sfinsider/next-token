<script>
"use strict";
/* =====================================================================
   SOUND ENGINE: AY-3-8912 emulation (1.7734 MHz, 17-bit noise LFSR,
   16-step envelope, logarithmic DAC) + 50 Hz tracker + tape loader
   (beeper). The same code runs inside the AudioWorklet.
   ===================================================================== */
function ENGINE(){
  const CLOCK=1773400, CPU=3500000, FT=69888, SPEED=6, PF=384, LOADER=600;
  const DAC=[0,0.00999465934234,0.0144502937362,0.0210574502174,0.0307011520562,0.0455481803616,0.0644998855573,0.107362478065,0.126588845655,0.20498970016,0.292210269322,0.372838941024,0.492530708782,0.635324635691,0.805584802014,1.0];
  const CH={Am:[57,60,64],F:[57,60,65],C:[55,60,64],G:[55,59,62],Dm:[57,62,65],E:[56,59,64]};
  const BASS={Am:45,F:41,C:48,G:43,Dm:38,E:40};
  const MELS={
    A:"A4 - - - E5 - - - D5 - C5 - B4 - C5 -  A4 - - - - - - - F4 - A4 - C5 - - -  G4 - - - C5 - - - E5 - D5 - C5 - G4 -  B4 - - - - - - - D5 - - - G5 - - -",
    B:"E5 - A5 - G5 - E5 - D5 - E5 - C5 - D5 -  C5 - - - A4 - C5 - F5 - E5 - C5 - A4 -  G5 - - - E5 - G5 - C6 - B5 - G5 - E5 -  D5 - - - B4 - D5 - G5 - A5 - B5 - - -",
    C:"F5 - - - E5 - D5 - A4 - - - D5 - F5 -  E5 - - - - - C5 - A4 - - - - - - -  G#4 - - - B4 - E5 - G#5 - - - F5 - E5 -  A5 - - - - - - - - - - - . - - -",
    END:"A4 - - - - - - - - - - - - - - -  E5 - - - - - - - D5 - - - C5 - - -  B4 - - - - - - - - - - - - - - -  A4 - - - - - - - - - - - - - - -"
  };
  const SEC=[
    {c:['Am','F','C','G'],b:'hold',d:null,l:null},
    {c:['Am','F','C','G'],b:'eight',d:'hat',l:null},
    {c:['Am','F','C','G'],b:'eight',d:'four',l:null},
    {c:['Am','F','C','G'],b:'eight',d:'four',l:'A'},
    {c:['Am','F','C','G'],b:'drive',d:'break',l:'A'},
    {c:['Dm','Am','E','Am'],b:'drive',d:'break',l:'C'},
    {c:['Dm','Am','E','E'],b:'hold',d:'riser',l:null,riser:1},
    {c:['Am','F','C','G'],b:'drive',d:'break',l:'B'},
    {c:['Am','F','C','G'],b:'drive',d:'double',l:'B'},
    {c:['Dm','Am','E','Am'],b:'drive',d:'break',l:'C'},
    {c:['Am','F','C','G'],b:'eight',d:'four',l:'A'},
    {c:['Am','F','C','Am'],b:'hold',d:'end',l:'END'}
  ];
  const TOTAL=SEC.length*PF;
  function n2m(x){const m=/^([A-G])(#?)(\d)$/.exec(x);const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];return 12*(+m[3]+1)+b+(m[2]?1:0);}
  const MEL={};
  for(const k in MELS){const o=[];for(const t of MELS[k].trim().split(/\s+/)){o.push(t==='-'?-1:t==='.'?-2:n2m(t));}while(o.length<64)o.push(-1);MEL[k]=o.slice(0,64);}
  function tp(m){return Math.max(1,Math.min(4095,Math.round(CLOCK/(16*440*Math.pow(2,(m-69)/12)))));}
  function drum(st,rb,bar){
    switch(st){
      case 'hat': return rb%4===2?'h':null;
      case 'four': if(rb===4||rb===12)return 's'; if(rb%4===0)return 'k'; if(rb%4===2)return 'h'; return null;
      case 'break': if(rb===0||rb===7||rb===10)return 'k'; if(rb===4||rb===12)return 's'; if(rb===2||rb===6||rb===14)return 'h'; return null;
      case 'double': if(rb===0||rb===3||rb===8||rb===10)return 'k'; if(rb===4||rb===12||rb===15)return 's'; if(rb===2||rb===6||rb===14)return 'h'; return null;
      case 'riser': if(bar<3)return (bar===2&&rb%4===0)?'k':null; return rb<8?(rb%2===0?'s':null):'s';
      case 'end': return (bar<2&&rb===0)?'k':null;
    }
    return null;
  }
  function drumAtRow(gr){if(gr<0)return null;const s=Math.floor(gr/64);if(s>=SEC.length)return null;const r=gr%64;return drum(SEC[s].d,r&15,r>>4);}
  const DR={
    k:[[150,0,15,1,0],[260,0,15,1,0],[420,0,14,1,0],[640,0,13,1,0],[900,0,12,1,0],[1200,0,10,1,0],[1500,0,7,1,0]],
    s:[[280,3,15,1,1],[340,5,15,1,1],[0,6,13,0,1],[0,7,12,0,1],[0,8,10,0,1],[0,9,8,0,1],[0,10,6,0,1],[0,11,4,0,1]],
    h:[[0,1,12,0,1],[0,1,9,0,1],[0,1,5,0,1]]
  };
  /* ---- AY chip ---- */
  const R=new Uint8Array(16), tc=[0,0,0], to=[0,0,0];
  let nc=0,lfsr=1,no=0,ec=0,epos=0,einv=15,ehold=0,efix=0;
  function envReset(){ec=0;epos=0;ehold=0;einv=(R[13]&4)?0:15;}
  function w(r,v){R[r]=v&255;if(r===13){R[13]&=15;envReset();}}
  function upd(){
    for(let i=0;i<3;i++){const p=(R[i*2]|((R[i*2+1]&15)<<8))||1;if(++tc[i]>=p){tc[i]=0;to[i]^=1;}}
    const np=(R[6]&31)||1;
    if(++nc>=np*2){nc=0;const bit=(lfsr^(lfsr>>3))&1;lfsr=(lfsr>>1)|(bit<<16);no=lfsr&1;}
    if(!ehold){const ep=(R[11]|(R[12]<<8))||1;
      if(++ec>=ep*2){ec=0;epos++;
        if(epos>15){const sh=R[13];
          if(!(sh&8)){ehold=1;efix=0;}
          else if(sh&1){ehold=1;efix=((15^einv)&15)^((sh&2)?15:0);}
          else{epos=0;if(sh&2)einv^=15;}}}}
  }
  /* ---- tracker ---- */
  let lead=-1,leadF=0,bn=-1,bF=0,dr=null,drF=0;
  function tick(mf){
    if(mf>=TOTAL){w(8,0);w(9,0);w(10,0);w(7,0x3F);return;}
    const si=Math.floor(mf/PF),s=SEC[si],lf=mf-si*PF,row=Math.floor(lf/SPEED),sub=lf%SPEED,bar=row>>4,rb=row&15,ch=s.c[bar];
    let mix=0x3F;
    // A: lead / riser
    if(sub===0){
      if(row===0&&!s.l)lead=-1;
      if(s.l){const v=MEL[s.l][row];if(v>=0){lead=v;leadF=0;}else if(v===-2)lead=-1;}
    }
    if(lead>=0){
      let p=tp(lead+(leadF===0?12:0));
      if(leadF>10)p=Math.round(p*(1+0.007*Math.sin((leadF-10)*0.85)));
      w(0,p&255);w(1,p>>8);
      const vol=s.l==='END'?Math.max(0,13-(leadF>>4)):(leadF<3?14:Math.max(9,13-(leadF>>3)));
      w(8,vol);mix&=~1;leadF++;
    }else if(s.riser){
      const k=lf/PF;w(6,Math.max(1,31-Math.floor(k*30)));w(8,Math.min(13,3+Math.floor(k*11)));mix&=~8;
    }else w(8,0);
    // B: bass (buzzer: tone + hardware envelope)
    const root=BASS[ch];let trig=false,note=bn;
    if(sub===0){
      if(s.b==='hold'){if(rb===0){note=root;trig=true;}}
      else if(s.b==='eight'){if((rb&1)===0){note=root+((rb&2)?12:0);trig=true;}}
      else{note=root+[0,0,12,0,0,12,0,7,0,0,12,0,0,12,7,12][rb];trig=true;}
    }
    if(trig){bn=note;bF=0;}
    if(bn>=0){
      const p=tp(bn);w(2,p&255);w(3,p>>8);mix&=~2;
      if(s.b==='hold'){let v=10;if(si===0)v=Math.min(10,4+(lf>>5));if(si===11)v=Math.max(0,11-(lf>>5));w(9,v);}
      else{const tri=s.b==='eight';
        if(bF===0){const ep=Math.max(1,Math.round(p/(tri?32:16)));w(11,ep&255);w(12,ep>>8);w(13,tri?0x0A:0x08);}
        const gate=s.b==='drive'?bF<4:bF<10;w(9,gate?16:0);}
      bF++;
    }else w(9,0);
    // C: arpeggio + drums
    if(sub===0){const d=s.d?drum(s.d,rb,bar):null;if(d){dr=d;drF=0;}}
    if(dr){const seq=DR[dr];
      if(drF<seq.length){const q=seq[drF];if(q[3]){w(4,q[0]&255);w(5,q[0]>>8);mix&=~4;}if(q[4]){w(6,q[1]);mix&=~32;}w(10,q[2]);drF++;}
      else dr=null;}
    if(!dr){
      const ns=CH[ch];const p=tp(ns[lf%3]+12);w(4,p&255);w(5,p>>8);mix&=~4;
      let v=(rb%4===0&&sub<2)?12:10;
      if(si===0)v=Math.min(10,lf>>4);if(si===11)v=Math.max(0,10-(lf>>5));if(si===6)v=9;
      w(10,v);
    }
    w(7,mix);
  }
  /* ---- tape (shared with the screen border) ---- */
  function makeTape(){
    const segs=[[0,70,0],[70,170,1],[170,180,2],[180,230,0],[230,310,1],[310,600,2]];
    let si=-1,seg=null,edge=0,lvl=0,rng=1,half=0,len=0;
    return function(T){
      const f=T/FT;
      while(si+1<segs.length&&f>=segs[si+1][0]){si++;seg=segs[si];edge=seg[0]*FT;lvl=0;rng=12345+si*777;half=0;}
      if(!seg||f>=LOADER||seg[2]===0)return 0;
      if(seg[2]===1)return 1+(Math.floor((T-seg[0]*FT)/2168)&1);
      while(T>=edge){if(half===0){rng=(Math.imul(rng,1103515245)+12345)&0x7fffffff;len=((rng>>16)&1)?1710:855;}edge+=len;half^=1;lvl^=1;}
      return 3+lvl;
    };
  }
  /* ---- renderer ---- */
  let sr=44100,stepA=0,accA=0,fAcc=0,frame=0,T=0,tStep=0,tape=makeTape(),pl=0,pr=0,dl=0,dR=0,lpB=0;
  function doFrame(){if(frame>=LOADER)tick(frame-LOADER);else{w(8,0);w(9,0);w(10,0);w(7,0x3F);}frame++;}
  function init(s){sr=s;stepA=CLOCK/8/sr;tStep=CPU/sr;w(7,0x3F);doFrame();}
  function render(L,Rt,n){
    for(let i=0;i<n;i++){
      fAcc+=50/sr;if(fAcc>=1){fAcc-=1;doFrame();}
      accA+=stepA;let sa=0,sb=0,sc=0,k=0;
      const m=R[7];
      while(accA>=1){accA-=1;upd();k++;
        const e=ehold?efix:((epos^einv)&15);
        for(let c=0;c<3;c++){
          if((to[c]|((m>>c)&1))&(no|((m>>(c+3))&1))){const v=R[8+c];const a=DAC[(v&16)?e:(v&15)];if(c===0)sa+=a;else if(c===1)sb+=a;else sc+=a;}
        }
      }
      if(k){sa/=k;sb/=k;sc/=k;}
      let l=sa*0.72+sb*0.5+sc*0.28,r=sa*0.28+sb*0.5+sc*0.72;
      if(frame<=LOADER+1){T+=tStep;const lv=tape(T);const bv=lv===0?0:((lv===2||lv===4)?0.2:-0.2);lpB+=(bv-lpB)*0.3;l+=lpB;r+=lpB;}
      const ol=l-pl+0.995*dl;pl=l;dl=ol;const orr=r-pr+0.995*dR;pr=r;dR=orr;
      L[i]=ol*0.55;Rt[i]=orr*0.55;
    }
  }
  return {init,render,SEC,PF,LOADER,TOTAL,SPEED,FT,drumAtRow,makeTape};
}

/* =====================================================================
   SCREEN: 256x192 bitmap + 32x24 attributes + per-line border
   ===================================================================== */
const E=ENGINE();
const PF=E.PF, LOADER=E.LOADER, TOTAL=E.TOTAL, FT=E.FT;
const BW=320,BH=240,BX=32,BY=24;
const cv=document.getElementById('scr'),g2=cv.getContext('2d');
const bl=document.getElementById('bloom'),b2=bl.getContext('2d');
const img=g2.createImageData(BW,BH),buf=new Uint32Array(img.data.buffer);
const pix=new Uint8Array(256*192),INK=new Uint8Array(768),PAP=new Uint8Array(768),BRI=new Uint8Array(768),FLA=new Uint8Array(768),border=new Uint8Array(BH);
const PAL=[];for(let b=0;b<2;b++){const v=b?255:215;for(let i=0;i<8;i++)PAL.push(0xFF000000|((i&1?v:0)<<16)|((i&4?v:0)<<8)|(i&2?v:0));}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function H(a,b=0,c=0){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}

function composite(F){
  const fl=(F>>4)&1;
  for(let y=0;y<BH;y++){
    const bc=PAL[border[y]],ro=y*BW;
    if(y<BY||y>=BY+192){buf.fill(bc,ro,ro+BW);continue;}
    buf.fill(bc,ro,ro+BX);buf.fill(bc,ro+BX+256,ro+BW);
    const sy=y-BY,ar=(sy>>3)*32,pr=sy*256;
    for(let cx=0;cx<32;cx++){
      const a=ar+cx;let i=INK[a],p=PAP[a];if(FLA[a]&&fl){const t=i;i=p;p=t;}
      const b=BRI[a]?8:0,ci=PAL[i+b],cp=PAL[p+b],o=ro+BX+cx*8,s=pr+cx*8;
      for(let k=0;k<8;k++)buf[o+k]=pix[s+k]?ci:cp;
    }
  }
}
function cls(i=7,p=0,b=0){pix.fill(0);INK.fill(i);PAP.fill(p);BRI.fill(b);FLA.fill(0);}
function attr(cx,cy,i,p,b=0,f=0){if(cx<0||cy<0||cx>31||cy>23)return;const a=cy*32+cx;if(i>=0)INK[a]=i;if(p>=0)PAP[a]=p;BRI[a]=b;FLA[a]=f;}
function attrRect(cx,cy,w,h,i,p,b=0,f=0){for(let y=cy;y<cy+h;y++)for(let x=cx;x<cx+w;x++)attr(x,y,i,p,b,f);}
function clearCells(cx,cy,w,h){for(let y=cy*8;y<(cy+h)*8;y++){if(y<0||y>191)continue;for(let x=cx*8;x<(cx+w)*8;x++)if(x>=0&&x<256)pix[y*256+x]=0;}}
function pset(x,y,v=1){x|=0;y|=0;if(x>=0&&y>=0&&x<256&&y<192)pix[y*256+x]=v;}
function pxor(x,y){x|=0;y|=0;if(x>=0&&y>=0&&x<256&&y<192)pix[y*256+x]^=1;}
function rectFill(x,y,w,h,v=1){for(let j=0;j<h;j++)for(let i=0;i<w;i++)pset(x+i,y+j,v);}
function rectLine(x,y,w,h){for(let i=0;i<w;i++){pset(x+i,y);pset(x+i,y+h-1);}for(let j=0;j<h;j++){pset(x,y+j);pset(x+w-1,y+j);}}
function line(x0,y0,x1,y1,dot=0){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;
  for(;;){if(!dot||((n++)&1))pset(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function disc(cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r)pset(cx+x,cy+y);}
function setBorder(c){border.fill(c);}
function shiftRow(y,dx){if(y<0||y>191||!dx)return;const row=pix.slice(y*256,y*256+256);for(let x=0;x<256;x++)pix[y*256+x]=row[(x-dx+512)&255];}

  NET.nodes.forEach((n,i)=>{const p=P[i],r=Math.max(2,Math.round(4-p.z*1.5))+(ka<3?1:0);disc(Math.round(p.x),Math.round(p.y),r);attr(Math.floor(p.x/8),Math.floor(p.y/8),lit.has(i)?7:5,0,1);});
  for(const [x,y] of pulses){rectFill(Math.round(x)-1,Math.round(y)-1,3,3);attr(Math.floor(x/8),Math.floor(y/8),6,0,1);}
  clearCells(0,20,32,4);attrRect(0,20,32,4,7,0,0);
  narr([{t:4,l:['JUST NUMBERS AND CONNECTIONS.']},{t:130,l:['Z80: 8 BITS. AI: BILLIONS.']},{t:256,l:['STILL, WE SEE A SOUL IN THEM.']}],lf,[21],7,1,1.2);
  tCell(0,0,'Z80',6,0,1);tCell(29,0,' AI',4,0,1);
}
const TW=384,TH=288,TD=new Float32Array(TW*TH),TA=new Float32Array(TW*TH);
for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const dx=x-192,dy=y-144,d=Math.sqrt(dx*dx+dy*dy)+0.5;TD[y*TW+x]=d;TA[y*TW+x]=(Math.atan2(dy,dx)/Math.PI+1)*64;}
const PH6=[['40 YEARS OF','BREAKING LIMITS.'],['NOW THE MACHINE','LEARNS TOO.']];
function sceneTunnel(lf,mf){
  const ox=Math.round(64+50*Math.sin(lf*0.021)),oy=Math.round(48+36*Math.sin(lf*0.017)),rot=lf*0.7,fw=lf*3+(hitAge(mf,'k')<4?6:0);
  for(let y=0;y<192;y++){const ro=(y+oy)*TW+ox;for(let x=0;x<256;x++){const d=TD[ro+x];const u=(TA[ro+x]+rot)|0,v=(1024/d+fw)|0;
    const tex=((u>>3)^(v>>3))&1;const sh=Math.min(1,d/130);pix[y*256+x]=(tex?sh*16:sh*3)>BAY[(y&3)*4+(x&3)]?1:0;}}
  const cols=[5,1,3,2,6,4];
  for(let cy=0;cy<24;cy++)for(let cx=0;cx<32;cx++){const i=(cy*8+4+oy)*TW+cx*8+4+ox,d=TD[i];const ring=((1024/d+fw)>>5)+(((TA[i]+rot)|0)>>5);attr(cx,cy,d<14?0:cols[((ring%6)+6)%6],0,d>60?1:0);}
  const idx=Math.floor(lf/192),ph=lf%192,p=PH6[idx];
  if(ph>=10&&ph<182){clearCells(0,10,32,4);attrRect(0,10,32,4,7,0,1);text(cx8(p[0],2),80,typed(p[0],12,ph,2),2,1);text(cx8(p[1],2),96,typed(p[1],12+p[0].length*2,ph,2),2,1);}
  for(let y=0;y<BH;y++)border[y]=cols[(((y>>3)+(lf>>2))%6+6)%6]&(hitAge(mf,'s')<3?7:1);
}
const STARS=[];for(let i=0;i<170;i++)STARS.push([(H(i,1)-0.5)*4,(H(i,2)-0.5)*3,H(i,3)]);
const PH7=[['PEEK AND POKE.',''],['PROMPT AND','REPLY.'],['THE SAME','CONVERSATION.']];
function sceneStars(lf,mf){
  cls(5,0,0);const rot=lf*0.004,cr=Math.cos(rot),sr=Math.sin(rot),sp=0.012+(hitAge(mf,'k')<4?0.01:0);
  for(const s of STARS){let z=((s[2]-lf*0.012)%1+1)%1*4+0.05,z2=z+0.06+sp*3;const x=s[0]*cr-s[1]*sr,y=s[0]*sr+s[1]*cr;
    const X=128+x/z*60,Y=96+y/z*60,X2=128+x/z2*60,Y2=96+y/z2*60;if(X<0||X>255||Y<0||Y>191)continue;
    line(X2,Y2,X,Y);if(z<1)attr(Math.floor(X/8),Math.floor(Y/8),7,0,1);else if(z<2)attr(Math.floor(X/8),Math.floor(Y/8),5,0,1);}
  const idx=Math.floor(lf/128),ph=lf%128,p=PH7[idx];
  if(ph>=6&&ph<122){const h=p[1]?4:2;clearCells(0,10,32,h);attrRect(0,10,32,h,6,0,1);text(cx8(p[0],2),80,typed(p[0],8,ph,2),2,1);if(p[1])text(cx8(p[1],2),96,typed(p[1],8+p[0].length*2,ph,2),2,1);}
  const c=96+70*Math.sin(lf*0.05);for(let y=0;y<BH;y++){const d=Math.abs(y-24-c);border[y]=d<2?7:d<5?6:d<9?2:d<13?1:0;}
}
const SCROLL='      NEXT TOKEN * MACHINES HAVE ALWAYS WAITED FOR US * IN 1982 WITH A CURSOR, TODAY WITH A PROMPT * GREETINGS TO THE SPECCY SCENE * CODE: CLAUDE * IDEA: ANDRÁS KÁNAI          ';
const GREETS=['ARISE * JOKER * STARDUST','KPACKU * UNDEFINED TEAM * CR!SP','AND EVERY SPECCY SCENER'];
const LUM=[0,1,2,3,4,5,6,7,7,6,5,4,3,2,1,0];
function sceneGreets(lf,mf){
  cls(7,0,0);
  text(cx8('NEXT TOKEN',2),8,'NEXT TOKEN',2,1,1,1);
  for(let cy=1;cy<=2;cy++)for(let x=0;x<32;x++)attr(x,cy,[2,6,4,5,3,7][((x>>1)+(lf>>2)+cy)%6],0,1);
  const bars=[1,1,3,2,6,6,2,3,1,0];
  for(let r=7;r<=16;r++)attrRect(0,r,32,1,7,bars[((r-7+Math.floor(lf/4))%10+10)%10],1);
  const speed=(SCROLL.length*16)/576,sc=Math.floor(lf*speed);
  for(let x=0;x<256;x++){const tx=x+sc,ci=Math.floor(tx/16);if(ci>=SCROLL.length)continue;const gx=(tx%16)>>1,g=GLY[SCROLL[ci]]||GLY[' '];
    const y0=Math.round(88+22*Math.sin((x+lf*2)*0.028));
    for(let r=0;r<8;r++){const b=g[r]|(g[r]>>1);if(b&(0x80>>gx)){pset(x,y0+r*2);pset(x,y0+r*2+1);}}}
  GREETS.forEach((s,i)=>tCenter(19+i*2,s,[5,6,7][i],0,1));
  const ka=hitAge(mf,'k');
  for(let y=0;y<BH;y++)border[y]=LUM[Math.floor(8+7.99*Math.sin(y*0.045+lf*0.08))&15]|(ka<2?7:0);
}
function sceneEnd(q,ended){
  cls(0,7,0);setBorder(7);
  tCell(0,0,'10 FOR T=1982 TO 2026');tCell(0,1,'20 NEXT TOKEN');
  const L=['NEXT TOKEN','ZX SPECTRUM 128 + AY','IDEA: ANDRÁS KÁNAI','CODE: CLAUDE'];
  L.forEach((s,i)=>tCenter(8+i*2,typed(s,10+i*18,q,1),i===0?2:0,7,i===0?1:0));
  tCell(0,23,'0 OK, 20:1');
  if(ended)tCenter(19,'CLICK TO RESTART',7,1,1);
}
function renderFrame(F,ended){
  if(F<LOADER){sceneLoader(F);return;}
  const mf=F-LOADER,sec=Math.floor(mf/PF),lf=mf%PF;
  if(sec>=12||(sec===11&&lf>=192)){sceneEnd(mf-(11*PF+192),ended);return;}
  switch(sec){
    case 0:sceneTitle(lf);break;
    case 1:sceneBasic(lf);break;
    case 2:case 3:sceneTokens(mf-2*PF,mf);break;
    case 4:case 5:scenePlasma(lf,sec,mf);break;
    case 6:sceneGlitch(lf,mf);break;
    case 7:sceneNeural(lf,mf);break;
    case 8:sceneTunnel(lf,mf);break;
    case 9:sceneStars(lf,mf);break;
    default:sceneGreets(mf-10*PF,mf);
  }
}

/* =====================================================================
   DISPLAY, AUDIO, CONTROLS
   ===================================================================== */
const stage=document.getElementById('stage'),crt=document.getElementById('crt');
let crtOn=true;
function layout(){
  const m=Math.min(innerWidth/BW,innerHeight/BH);const s=m>=2?Math.floor(m):m;const w=BW*s,h=BH*s;
  stage.style.width=w+'px';stage.style.height=h+'px';
  for(const c of [cv,bl]){c.style.width=w+'px';c.style.height=h+'px';}
  bl.style.filter=`blur(${Math.max(2,s*1.6)}px) brightness(1.3)`;
  crt.style.width=w+'px';crt.style.height=h+'px';
  crt.style.background=crtOn?`repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) ${s*0.55}px,rgba(0,0,0,.32) ${s}px),radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.6) 100%)`:'none';
  bl.style.display=crtOn?'block':'none';
}
addEventListener('resize',layout);layout();
let actx=null,t0=0,node=null,lastF=-1,ended=false,startedAt=0,audioReady=false,suspSince=0,gen=0;
const DEBUG=new URLSearchParams(location.search).get('f');
const MSG_BLOCK='Sound is blocked in this window. Click here! If it stays silent, open the file in Chrome or Firefox.',MSG_SILENT='Running without sound: this window blocks audio. Open the downloaded file in a browser.';
const snd=document.createElement('div');
snd.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:90vw;background:#d70000;color:#fff;padding:10px 16px;font:14px ui-monospace,monospace;z-index:9;cursor:pointer;display:none;text-align:center';
document.body.appendChild(snd);
function hint(t){if(!t){snd.style.display='none';return;}snd.textContent=t;snd.style.display='block';}
function kick(){if(actx&&actx.state!=='running'){actx.resume().catch(()=>{});}}
snd.addEventListener('click',e=>{e.stopPropagation();kick();});
addEventListener('pointerdown',kick,true);addEventListener('keydown',kick,true);
function draw(F){renderFrame(F,ended);composite(F);g2.putImageData(img,0,0);if(crtOn){b2.clearRect(0,0,BW,BH);b2.drawImage(cv,0,0);}}
function loop(){
  requestAnimationFrame(loop);
  if(!actx&&!startedAt)return;
  let F=0;
  if(actx){
    if(!audioReady)return;
    if(actx.state!=='running'&&!paused){
      if(!suspSince)suspSince=performance.now();
      if(performance.now()-suspSince>600)hint(MSG_BLOCK);
      if(performance.now()-suspSince>6000&&lastF<=0){try{actx.close();}catch(e){}actx=null;startedAt=performance.now();hint(MSG_SILENT);setTimeout(()=>hint(''),7000);}
      return;
    }
    suspSince=0;if(snd.textContent===MSG_BLOCK)hint('');
    F=Math.floor((actx.currentTime-t0-(actx.outputLatency||actx.baseLatency||0))*50);
  }else F=Math.floor((performance.now()-startedAt)/20);
  if(F<0)F=0;if(F===lastF)return;lastF=F;
  if(F>=LOADER+TOTAL+50)ended=true;
  draw(F);
}
let paused=false;
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);}
function start(){
  document.getElementById('start').style.display='none';
  ended=false;lastF=-1;tapeFn=E.makeTape();tapeLastT=-1;audioReady=false;suspSince=0;paused=false;startedAt=0;hint('');
  const my=++gen;
  if(actx){try{actx.close();}catch(e){}actx=null;}
  let ctx;
  try{ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}
  catch(e){console.info('Running without sound.',e);startedAt=performance.now();return;}
  actx=ctx;
  ctx.resume().catch(()=>{});
  try{const bf=ctx.createBuffer(1,1,22050),sn=ctx.createBufferSource();sn.buffer=bf;sn.connect(ctx.destination);sn.start(0);}catch(e){}
  setupAudio(ctx,my);
}
async function setupAudio(ctx,my){
  let n=null;
  if(ctx.audioWorklet&&window.AudioWorkletNode){
    try{
      const src=ENGINE.toString()+`;class P extends AudioWorkletProcessor{constructor(){super();this.e=ENGINE();this.e.init(sampleRate);}process(i,o){const c=o[0];this.e.render(c[0],c[1]||c[0],c[0].length);return true;}}registerProcessor('ay-128',P);`;
      try{await withTimeout(ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src],{type:'application/javascript'}))),1500);}
      catch(e1){await withTimeout(ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,'+encodeURIComponent(src)),1500);}
      n=new AudioWorkletNode(ctx,'ay-128',{numberOfInputs:0,outputChannelCount:[2]});
    }catch(e){n=null;console.info('AudioWorklet unavailable, using ScriptProcessor.');}
  }
  if(my!==gen)return;
  if(!n){const eng=ENGINE();eng.init(ctx.sampleRate);n=ctx.createScriptProcessor(2048,0,2);n.onaudioprocess=ev=>{const b=ev.outputBuffer;eng.render(b.getChannelData(0),b.getChannelData(1),b.length);};}
  node=n;n.connect(ctx.destination);ctx.resume().catch(()=>{});t0=ctx.currentTime;audioReady=true;
}
document.getElementById('go').addEventListener('click',e=>{e.stopPropagation();start();});
document.getElementById('start').addEventListener('click',start);
cv.parentElement.addEventListener('click',()=>{if(ended)start();});
addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(e.key==='c'||e.key==='C'){crtOn=!crtOn;layout();}
  else if(e.key===' '&&actx){e.preventDefault();if(actx.state==='running'){paused=true;actx.suspend();}else{paused=false;actx.resume();}}
});
if(DEBUG!==null){document.getElementById('start').style.display='none';draw(+DEBUG);}
else requestAnimationFrame(loop);
